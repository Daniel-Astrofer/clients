flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # OS launcher/tray icons cannot use Lottie JSON — they need raster.
  # This PNG is the brand still for mipmaps/AppIcon (same art as former
  # kerosene-logo.png). In-app brand uses kerosene-logo-white.json Lottie.
  image_path: "assets/logo/kerosene-logo-white.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/kerosene-logo-white.png"
  web:
    generate: true
    image_path: "assets/logo/kerosene-logo-white.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/logo/kerosene-logo-white.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo/kerosene-logo-white.png"
