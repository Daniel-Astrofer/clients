name: Clients CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      component: clients

  flutter:
    uses: Daniel-Astrofer/.github/.github/workflows/flutter-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      flutter-version: '3.44.6'
      enforce-analyze: false
      run-tests: false

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
