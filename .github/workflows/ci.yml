name: Clients CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
    with:
      component: clients

  flutter:
    uses: Daniel-Astrofer/.github/.github/workflows/flutter-ci.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
    with:
      flutter-version: '3.44.6'
      enforce-analyze: false
      run-tests: false

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
