name: kerosene
description: 'Frontend of Kerosene'
publish_to: 'none'
version: '1.0.0+1'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  characters: ^1.3.0
  bip39_mnemonic: ^4.0.1
  blockchain_utils: ^5.4.0
  qr_flutter: ^4.1.0
  http: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.2.3
  dartz: ^0.10.1
  dio: ^5.4.3+1
  equatable: ^2.0.5
  timeago: ^3.5.0
  intl: ^0.20.2
  device_info_plus: ^13.1.0
  crypto: ^3.0.3

  bip39: ^1.0.6
  fl_chart: ^1.2.0
  mobile_scanner: ^7.2.0
  nfc_manager: ^4.1.1
  nfc_manager_ndef: ^1.1.0
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  sensors_plus: ^7.0.0
  path_provider: ^2.1.5
  stomp_dart_client: ^3.0.1
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  # bitcoin_flutter: ^1.0.12 # Removed due to null safety issues
  flutter_local_notifications: ^21.0.0
  flutter_background_service: ^5.1.0

  dio_smart_retry: ^7.0.1
  google_fonts: ^8.0.2
  slip39: ^0.3.0
  uuid: ^4.5.3
  flutter_svg: ^2.0.17
  package_info_plus: ^10.1.0
  tor: ^0.1.1
  socks5_proxy: ^2.1.1
  cryptography: ^2.7.0
  safe_device: ^1.3.8
  lucide_icons:
    path: third_party/lucide_icons
  flutter_animate: ^4.5.2
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.1
  share_plus: ^13.2.1

  flutter_web_plugins:
    sdk: flutter
  storybook_flutter: ^0.14.1
  dio_cache_interceptor: ^3.5.1
  cached_network_image: ^3.4.1
  dio_cache_interceptor_hive_store: ^4.0.0
  bitcoin_base: ^7.0.0
  # Vendored: IconData became final in Flutter 3.32+/3.44; pub 2.1.0 still extends it.
  phosphor_flutter:
    path: third_party/phosphor_flutter
  video_player: ^2.13.0
  pdf: ^3.11.1
  sqflite: ^2.4.1
  path: ^1.9.0
  sqflite_common_ffi: ^2.4.2
  rive: ^0.14.9
  lottie: ^3.5.1
  go_router: ^17.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  golden_toolkit: ^0.15.0
  mockito: ^5.4.4
  test: ^1.30.0
  build_runner: ^2.4.9

  local_auth_android: any
  local_auth_darwin: any
  local_auth_windows: any

dependency_overrides:
  lucide_icons:
    path: third_party/lucide_icons
  tor:
    path: third_party/tor
flutter:
  uses-material-design: true
  generate: true

  assets:
    - 'assets/welcome_phone_mockup.png'
    - 'assets/feed/cards/'
    - 'assets/google_fonts/'
    - 'assets/logo/'
    - 'assets/hero/'
    - 'assets/animations/lottie/'
    - 'assets/animations/rive/'
    - 'assets/backgrounds/'

  shaders:
    - 'assets/shaders/home_aurora.frag'
    - 'assets/shaders/bitcoin_hodl.frag'
    - 'assets/shaders/card_wood.frag'
    - 'assets/shaders/card_metal.frag'
    - 'assets/shaders/card_diamond.frag'
    - 'assets/shaders/card_ruby.frag'
    - 'assets/shaders/card_emerald.frag'

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/kerosene-logo.png"
  min_sdk_android: 21
